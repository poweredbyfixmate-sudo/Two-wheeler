<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FixMate Bikes — Two Wheeler Seconds Sale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0e1322; --panel:#131a2b; --border:#232c42;
  --orange:#ff6b1a; --orange-dim:rgba(255,107,26,0.18);
  --text:#e8ecf5; --muted:#7d879e; --chrome:#9aa7ad;
  --led-green:#3ddc84; --led-red:#ff4d4d;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
body{
  background:
    radial-gradient(circle at 10% 0%, rgba(255,107,26,0.06), transparent 40%),
    var(--bg);
  color:var(--text); font-family:'Work Sans',sans-serif; padding-bottom:40px; min-height:100vh;
}

/* HEADER — with tachometer motif */
header{
  padding:20px 16px 16px; background:linear-gradient(180deg,#0d1220,#0a0e1a);
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.brand-block h1{
  font-family:'Anton',sans-serif; font-size:24px; letter-spacing:0.5px;
  color:#fff; text-transform:uppercase; line-height:1;
}
.brand-block h1 span{color:var(--orange);}
.brand-block p{
  color:var(--muted); font-size:10px; margin-top:5px; font-family:'JetBrains Mono',monospace;
  letter-spacing:1.5px; text-transform:uppercase;
}
.tacho{flex-shrink:0; opacity:0.9;}

/* FILTERS — dashboard-toggle styled */
.filters{padding:14px 16px 0; display:flex; flex-direction:column; gap:10px;}
.search-box{
  display:flex; align-items:center; background:var(--panel); border:1px solid var(--border);
  border-radius:8px; padding:11px 14px;
}
.search-box input{
  background:transparent; border:none; outline:none; color:var(--text); flex:1;
  font-size:14px; font-family:'Work Sans',sans-serif;
}
.search-box svg{flex-shrink:0; margin-right:8px;}
.filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;}
.filter-unit{flex-shrink:0; min-width:108px;}
.filter-unit label{
  display:block; font-size:9px; color:var(--muted); font-family:'JetBrains Mono',monospace;
  letter-spacing:1px; text-transform:uppercase; margin-bottom:3px; padding-left:2px;
}
.filter-unit select{
  width:100%; background:var(--panel); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:9px 8px; font-size:12px; font-family:'JetBrains Mono',monospace;
}

/* GRID / CARDS — price-tag signature */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 12px; padding:22px 16px 16px;}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}

.card{
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  overflow:visible; cursor:pointer; transition:border-color .15s, transform .15s;
  position:relative;
}
.card:active{transform:scale(0.97); border-color:var(--orange);}
.card-media{position:relative; border-radius:10px 10px 0 0; overflow:hidden;}
.card-media img{
  width:100%; aspect-ratio:4/3; object-fit:cover; display:block;
  background:#1a2136 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23445" stroke-width="1"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17h6l3-8h4M9 9h6l2 5"/></svg>') no-repeat center / 38%;
}
.card-media::after{
  content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.55) 100%);
}
.dash-light{
  position:absolute; top:9px; left:9px; z-index:2; display:flex; align-items:center; gap:5px;
  background:rgba(10,14,26,0.72); padding:4px 8px 4px 6px; border-radius:20px;
  font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
}
.dash-light .led{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.dash-light.available .led{background:var(--led-green); box-shadow:0 0 6px var(--led-green);}
.dash-light.available{color:var(--led-green);}
.dash-light.sold .led{background:var(--led-red);}
.dash-light.sold{color:var(--led-red);}

.price-tag{
  position:absolute; z-index:3; bottom:-13px; left:10px;
  background:var(--orange); color:#1a0d02; font-family:'Anton',sans-serif;
  font-size:14px; padding:5px 10px 4px; border-radius:4px; transform:rotate(-3deg);
  box-shadow:0 3px 8px rgba(0,0,0,0.45), 0 0 0 2px #1a0d02 inset;
  letter-spacing:0.3px;
}
.price-tag::before{
  content:''; position:absolute; top:-3px; left:8px; width:5px; height:5px; border-radius:50%;
  background:#1a0d02;
}

.card-info{padding:20px 12px 12px;}
.card-info h3{
  font-size:13px; color:#fff; font-weight:600; text-transform:uppercase; letter-spacing:0.3px;
  line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.odo{
  display:inline-flex; align-items:baseline; gap:4px; background:#050810; border:1px solid #1c2438;
  border-radius:5px; padding:4px 7px; margin-top:8px; font-family:'JetBrains Mono',monospace;
}
.odo .val{color:var(--orange); font-size:11px; font-weight:700; letter-spacing:1px;}
.odo .unit{color:var(--muted); font-size:8px; letter-spacing:1px;}
.card-meta{font-size:10px; color:var(--muted); font-family:'JetBrains Mono',monospace; margin-top:7px; letter-spacing:0.3px;}

.empty-state{grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:13px;}

/* DETAIL SHEET */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none; align-items:flex-end; z-index:100;}
.overlay.show{display:flex;}
.sheet{background:var(--bg2); width:100%; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0; border-top:1px solid var(--border); animation:slideUp .22s ease; position:relative;}
@keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:4px; margin:10px auto;}
.close-btn{position:absolute; top:14px; right:14px; background:rgba(0,0,0,0.5); color:#fff; border:none; width:30px; height:30px; border-radius:50%; font-size:16px; z-index:5;}
.detail-imgs{display:flex; gap:8px; overflow-x:auto; padding:0 16px 14px;}
.detail-imgs img{width:150px; height:110px; object-fit:cover; border-radius:8px; flex-shrink:0; background:#1a2136;}
.detail-body{padding:4px 20px 20px;}
.detail-body h2{font-family:'Anton',sans-serif; font-size:20px; color:#fff; text-transform:uppercase; letter-spacing:0.3px;}
.detail-plate{
  display:inline-block; background:var(--orange); color:#1a0d02; font-family:'Anton',sans-serif;
  font-size:22px; padding:8px 16px 6px; border-radius:5px; margin:10px 0 16px;
  box-shadow:0 0 0 2px #1a0d02 inset;
}
.spec-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:16px;}
.spec-item{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:9px 12px; border-left:2px solid var(--orange);}
.spec-item .label{font-size:9px; color:var(--muted); text-transform:uppercase; font-family:'JetBrains Mono',monospace; letter-spacing:1px;}
.spec-item .value{font-size:14px; color:#fff; font-weight:600; margin-top:3px;}
.desc{font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:18px;}
.wa-btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  background:#25D366; color:#fff; border:none; padding:14px; border-radius:8px;
  font-size:14px; font-weight:600; font-family:'Work Sans',sans-serif;
}

/* ADMIN */
.admin-fab{
  position:fixed; bottom:20px; right:16px; width:48px; height:48px; border-radius:50%;
  background:var(--orange); color:#1a0d02; border:none; font-size:18px; z-index:50;
  box-shadow:0 4px 18px rgba(255,107,26,0.4); font-family:'JetBrains Mono',monospace; font-weight:700;
}
.pin-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:200; padding:20px;}
.pin-overlay.show{display:flex;}
.pin-box{background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:26px 22px; width:100%; max-width:300px; text-align:center;}
.pin-box h3{color:#fff; font-family:'Anton',sans-serif; margin-bottom:14px; text-transform:uppercase; font-size:16px;}
.pin-box input{
  width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text);
  text-align:center; letter-spacing:8px; font-size:18px; padding:12px; border-radius:8px;
  font-family:'JetBrains Mono',monospace; margin-bottom:12px;
}
.btn-primary{width:100%; background:var(--orange); color:#1a0d02; border:none; padding:12px; border-radius:8px; font-weight:700; font-size:13px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.5px;}
.btn-secondary{width:100%; background:transparent; color:var(--muted); border:1px solid var(--border); padding:10px; border-radius:8px; font-size:12px; margin-top:8px; font-family:'JetBrains Mono',monospace;}

.admin-overlay{position:fixed; inset:0; background:var(--bg); display:none; z-index:150; overflow-y:auto;}
.admin-overlay.show{display:block;}
.admin-header{display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5;}
.admin-header h2{font-family:'Anton',sans-serif; color:#fff; text-transform:uppercase; font-size:18px;}
.admin-header button{background:var(--panel); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:8px; font-size:12px; font-family:'JetBrains Mono',monospace;}
.admin-tabs{display:flex; gap:8px; padding:14px 16px 0;}
.admin-tab{flex:1; text-align:center; padding:10px; border-radius:8px; background:var(--panel); border:1px solid var(--border); color:var(--muted); font-size:12px; font-weight:600; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.3px;}
.admin-tab.active{background:var(--orange); color:#1a0d02; border-color:var(--orange);}
.admin-panel{padding:16px;}
.admin-panel.hidden{display:none;}
.form-field{margin-bottom:12px;}
.form-field label{display:block; font-size:10px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; letter-spacing:0.5px;}
.form-field input, .form-field select, .form-field textarea{
  width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text);
  padding:11px 12px; border-radius:8px; font-size:14px; font-family:'Work Sans',sans-serif;
}
.form-field textarea{min-height:70px; resize:vertical; font-family:'JetBrains Mono',monospace; font-size:12px;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.admin-list-item{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; display:flex; gap:10px; align-items:center; border-left:2px solid var(--orange);}
.admin-list-item img{width:54px; height:54px; border-radius:6px; object-fit:cover; background:#1a2136; flex-shrink:0;}
.admin-list-info{flex:1; min-width:0;}
.admin-list-info h4{font-size:12px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase;}
.admin-list-info span{font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
.admin-list-actions{display:flex; flex-direction:column; gap:5px;}
.admin-list-actions button{font-size:9px; padding:5px 8px; border-radius:5px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-weight:700; font-family:'JetBrains Mono',monospace; text-transform:uppercase;}
.admin-list-actions button.danger{color:var(--led-red); border-color:#5a2222;}
.admin-list-actions button.toggle{color:var(--led-green); border-color:#1e5a35;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--orange); color:#fff; padding:10px 18px; border-radius:8px; font-size:12px; z-index:300; display:none; font-family:'JetBrains Mono',monospace;}
.loading{text-align:center; padding:40px; color:var(--muted); grid-column:1/-1; font-family:'JetBrains Mono',monospace; font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="brand-block">
    <h1>FixMate <span>Bikes</span></h1>
    <p>Coimbatore · Second-Hand Showroom</p>
  </div>
  <svg class="tacho" width="46" height="46" viewBox="0 0 46 46" fill="none">
    <path d="M6 32 A19 19 0 1 1 40 32" stroke="#232c42" stroke-width="3" fill="none"/>
    <path d="M6 32 A19 19 0 0 1 23 13" stroke="#ff6b1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="23" y1="23" x2="30" y2="16" stroke="#ff6b1a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="23" cy="23" r="2.5" fill="#ff6b1a"/>
  </svg>
</header>

<div class="filters">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d879e" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="Search brand, model...">
  </div>
  <div class="filter-row">
    <div class="filter-unit"><label>Brand</label><select id="brandFilter"><option value="">All</option></select></div>
    <div class="filter-unit"><label>Fuel</label>
      <select id="fuelFilter"><option value="">All</option><option value="Petrol">Petrol</option><option value="Electric">Electric</option></select>
    </div>
    <div class="filter-unit"><label>Budget</label>
      <select id="priceFilter">
        <option value="">All</option>
        <option value="0-30000">Under 30k</option>
        <option value="30000-50000">30k – 50k</option>
        <option value="50000-80000">50k – 80k</option>
        <option value="80000-999999999">Above 80k</option>
      </select>
    </div>
    <div class="filter-unit"><label>Status</label>
      <select id="statusFilter"><option value="">All</option><option value="Available">Available</option><option value="Sold">Sold</option></select>
    </div>
  </div>
</div>

<div class="grid" id="bikeGrid">
  <div class="loading">Loading bikes...</div>
</div>

<button class="admin-fab" id="adminFab">⚙</button>

<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <button class="close-btn" id="closeDetail">✕</button>
    <div class="sheet-handle"></div>
    <div class="detail-imgs" id="detailImgs"></div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<div class="pin-overlay" id="pinOverlay">
  <div class="pin-box">
    <h3>Admin Login</h3>
    <input type="password" id="pinInput" maxlength="4" inputmode="numeric" placeholder="••••">
    <button class="btn-primary" id="pinSubmit">Unlock</button>
    <button class="btn-secondary" id="pinCancel">Cancel</button>
  </div>
</div>

<div class="admin-overlay" id="adminOverlay">
  <div class="admin-header">
    <h2>Admin</h2>
    <button id="adminClose">Close</button>
  </div>
  <div class="admin-tabs">
    <div class="admin-tab active" data-tab="addTab">+ Add Bike</div>
    <div class="admin-tab" data-tab="manageTab">Manage (<span id="bikeCount">0</span>)</div>
  </div>

  <div class="admin-panel" id="addTab">
    <div class="form-field"><label>Brand</label><input id="f_brand" placeholder="e.g. Honda"></div>
    <div class="form-field"><label>Model</label><input id="f_model" placeholder="e.g. Activa 6G"></div>
    <div class="form-row">
      <div class="form-field"><label>Year</label><input id="f_year" type="number" placeholder="2021"></div>
      <div class="form-field"><label>KM Run</label><input id="f_km" type="number" placeholder="12000"></div>
    </div>
    <div class="form-row">
      <div class="form-field"><label>Price (₹)</label><input id="f_price" type="number" placeholder="55000"></div>
      <div class="form-field"><label>Fuel Type</label><select id="f_fuel"><option>Petrol</option><option>Electric</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-field"><label>Condition</label><select id="f_condition"><option>Excellent</option><option>Good</option><option>Fair</option></select></div>
      <div class="form-field"><label>Owners</label><select id="f_owners"><option>1st Owner</option><option>2nd Owner</option><option>3rd Owner</option></select></div>
    </div>
    <div class="form-field"><label>Insurance Valid Till</label><input id="f_insurance" placeholder="e.g. Dec 2026"></div>
    <div class="form-field"><label>Description</label><textarea id="f_desc" placeholder="Well maintained, single hand used, all papers clear..."></textarea></div>
    <div class="form-field"><label>Image URLs (one per line)</label><textarea id="f_images" placeholder="https://...&#10;https://..."></textarea></div>
    <input type="hidden" id="f_id">
    <button class="btn-primary" id="saveBtn">Save Bike</button>
    <button class="btn-secondary" id="clearFormBtn">Clear Form</button>
  </div>

  <div class="admin-panel hidden" id="manageTab">
    <div id="adminList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwVULprkKPUBLe9T0-sPFDmGlMmgMIyt6COka1e0LMG5F61ZqROTRkF2Jvt2sgcYGG4/exec';
const WHATSAPP_NUMBER = '919025156687';
const PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23445" stroke-width="1"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17h6l3-8h4M9 9h6l2 5"/></svg>';

let allBikes = [];
let sessionPin = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(()=> t.style.display = 'none', 2200);
}
function fmtPrice(p){ return '₹' + Number(p || 0).toLocaleString('en-IN'); }

async function apiCall(params){
  const url = APPS_SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}

async function loadBikes(){
  if(APPS_SCRIPT_URL.includes('PASTE_YOUR')){
    document.getElementById('bikeGrid').innerHTML = '<div class="empty-state">⚠ Backend URL not set.<br>Deploy TwoWheelerBackend.gs and paste the URL in APPS_SCRIPT_URL.</div>';
    return;
  }
  try{
    const data = await apiCall({action:'list'});
    if(data.success){
      allBikes = data.bikes;
      localStorage.setItem('bikesCache', JSON.stringify(allBikes));
      populateBrandFilter(); renderGrid(); renderAdminList();
    }
  }catch(err){
    const cached = localStorage.getItem('bikesCache');
    if(cached){ allBikes = JSON.parse(cached); populateBrandFilter(); renderGrid(); }
    else document.getElementById('bikeGrid').innerHTML = '<div class="empty-state">Could not load bikes. Check connection.</div>';
  }
}

function populateBrandFilter(){
  const sel = document.getElementById('brandFilter');
  const brands = [...new Set(allBikes.map(b=>b.Brand).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All</option>' + brands.map(b=>`<option value="${b}">${b}</option>`).join('');
}

function getFilteredBikes(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const brand = document.getElementById('brandFilter').value;
  const fuel = document.getElementById('fuelFilter').value;
  const priceRange = document.getElementById('priceFilter').value;
  const status = document.getElementById('statusFilter').value;
  return allBikes.filter(b=>{
    if(q && !(`${b.Brand} ${b.Model}`.toLowerCase().includes(q))) return false;
    if(brand && b.Brand !== brand) return false;
    if(fuel && b.FuelType !== fuel) return false;
    if(status && b.Status !== status) return false;
    if(priceRange){
      const [min,max] = priceRange.split('-').map(Number);
      const p = Number(b.Price || 0);
      if(p < min || p > max) return false;
    }
    return true;
  });
}

function renderGrid(){
  const grid = document.getElementById('bikeGrid');
  const bikes = getFilteredBikes();
  if(bikes.length === 0){ grid.innerHTML = '<div class="empty-state">No bikes match // adjust filters</div>'; return; }
  grid.innerHTML = bikes.map(b=>{
    const img = (b.Images || '').split('\n').filter(Boolean)[0] || PLACEHOLDER_IMG;
    const dashClass = b.Status === 'Sold' ? 'sold' : 'available';
    return `
    <div class="card" onclick="openDetail('${b.ID}')">
      <div class="card-media">
        <img src="${img}" onerror="this.src='${PLACEHOLDER_IMG}'">
        <div class="dash-light ${dashClass}"><span class="led"></span>${b.Status}</div>
        <div class="price-tag">${fmtPrice(b.Price)}</div>
      </div>
      <div class="card-info">
        <h3>${b.Brand} ${b.Model}</h3>
        <div class="odo"><span class="val">${Number(b.KM||0).toLocaleString('en-IN')}</span><span class="unit">KM</span></div>
        <div class="card-meta">${b.Year} · ${b.FuelType}</div>
      </div>
    </div>`;
  }).join('');
}

function openDetail(id){
  const b = allBikes.find(x=>String(x.ID)===String(id));
  if(!b) return;
  const imgs = (b.Images || '').split('\n').filter(Boolean);
  const imgList = imgs.length ? imgs : [PLACEHOLDER_IMG];
  document.getElementById('detailImgs').innerHTML = imgList.map(i=>`<img src="${i}" onerror="this.src='${PLACEHOLDER_IMG}'">`).join('');
  const waMsg = encodeURIComponent(`Hi! I'm interested in the ${b.Brand} ${b.Model} (${b.Year}) listed for ${fmtPrice(b.Price)}. Is it still available?`);
  document.getElementById('detailBody').innerHTML = `
    <h2>${b.Brand} ${b.Model}</h2>
    <div class="detail-plate">${fmtPrice(b.Price)}</div>
    <div class="spec-grid">
      <div class="spec-item"><div class="label">Year</div><div class="value">${b.Year}</div></div>
      <div class="spec-item"><div class="label">KM Run</div><div class="value">${Number(b.KM||0).toLocaleString('en-IN')} km</div></div>
      <div class="spec-item"><div class="label">Fuel</div><div class="value">${b.FuelType}</div></div>
      <div class="spec-item"><div class="label">Condition</div><div class="value">${b.Condition}</div></div>
      <div class="spec-item"><div class="label">Owners</div><div class="value">${b.Owners}</div></div>
      <div class="spec-item"><div class="label">Insurance</div><div class="value">${b.Insurance || '-'}</div></div>
    </div>
    <div class="desc">${b.Description || ''}</div>
    <button class="wa-btn" onclick="window.open('https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}','_blank')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.06L2 22l5.06-1.34A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.24.68-1.4 1.3-1.94 1.34-.5.04-1.1.2-3.7-.8-2.66-1.02-4.34-3.7-4.48-3.86-.14-.16-1.06-1.4-1.06-2.68 0-1.28.68-1.9.92-2.16.24-.26.54-.32.72-.32.18 0 .36 0 .52.02.16.02.4-.06.62.48.24.58.82 2 .9 2.14.08.14.14.32.02.5-.12.18-.18.3-.36.46-.18.16-.38.36-.54.48-.18.14-.36.3-.16.62.2.32.9 1.5 1.94 2.42 1.34 1.2 2.46 1.58 2.78 1.76.32.18.5.16.7-.06.2-.22.84-.98 1.06-1.32.22-.34.44-.28.74-.16.3.1 1.9.9 2.22 1.06.32.16.54.24.62.38.08.14.08.8-.16 1.48z"/></svg>
      Enquire on WhatsApp
    </button>
  `;
  document.getElementById('detailOverlay').classList.add('show');
}

document.getElementById('closeDetail').onclick = ()=> document.getElementById('detailOverlay').classList.remove('show');
document.getElementById('detailOverlay').onclick = (e)=>{ if(e.target.id==='detailOverlay') e.currentTarget.classList.remove('show'); };

['searchInput','brandFilter','fuelFilter','priceFilter','statusFilter'].forEach(id=>{
  document.getElementById(id).addEventListener('input', renderGrid);
  document.getElementById(id).addEventListener('change', renderGrid);
});

document.getElementById('adminFab').onclick = ()=>{
  if(sessionPin){ document.getElementById('adminOverlay').classList.add('show'); }
  else document.getElementById('pinOverlay').classList.add('show');
};
document.getElementById('pinCancel').onclick = ()=>{
  document.getElementById('pinOverlay').classList.remove('show');
  document.getElementById('pinInput').value = '';
};
document.getElementById('pinSubmit').onclick = ()=>{
  const val = document.getElementById('pinInput').value;
  sessionPin = val;
  document.getElementById('pinOverlay').classList.remove('show');
  document.getElementById('pinInput').value = '';
  document.getElementById('adminOverlay').classList.add('show');
  renderAdminList();
};
document.getElementById('adminClose').onclick = ()=> document.getElementById('adminOverlay').classList.remove('show');

document.querySelectorAll('.admin-tab').forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll('.admin-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.admin-panel').forEach(p=>p.classList.add('hidden'));
    document.getElementById(tab.dataset.tab).classList.remove('hidden');
  };
});

function clearForm(){
  ['f_brand','f_model','f_year','f_km','f_price','f_insurance','f_desc','f_images','f_id'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f_fuel').value = 'Petrol';
  document.getElementById('f_condition').value = 'Excellent';
  document.getElementById('f_owners').value = '1st Owner';
  document.getElementById('saveBtn').textContent = 'Save Bike';
}
document.getElementById('clearFormBtn').onclick = clearForm;

document.getElementById('saveBtn').onclick = async ()=>{
  const id = document.getElementById('f_id').value;
  const payload = {
    pin: sessionPin,
    brand: document.getElementById('f_brand').value,
    model: document.getElementById('f_model').value,
    year: document.getElementById('f_year').value,
    km: document.getElementById('f_km').value,
    price: document.getElementById('f_price').value,
    fuelType: document.getElementById('f_fuel').value,
    condition: document.getElementById('f_condition').value,
    owners: document.getElementById('f_owners').value,
    insurance: document.getElementById('f_insurance').value,
    description: document.getElementById('f_desc').value,
    images: document.getElementById('f_images').value
  };
  if(!payload.brand || !payload.model || !payload.price){ toast('Brand, Model, Price required'); return; }
  payload.action = id ? 'update' : 'add';
  if(id) payload.id = id;
  document.getElementById('saveBtn').textContent = 'Saving...';
  const res = await apiCall(payload);
  if(res.success){
    toast(id ? 'Bike updated' : 'Bike added');
    clearForm();
    await loadBikes();
    document.querySelector('.admin-tab[data-tab="manageTab"]').click();
  } else {
    toast(res.error === 'Wrong PIN' ? 'Wrong PIN' : 'Error: ' + res.error);
    if(res.error === 'Wrong PIN') sessionPin = null;
  }
  document.getElementById('saveBtn').textContent = 'Save Bike';
};

function editBike(id){
  const b = allBikes.find(x=>String(x.ID)===String(id));
  if(!b) return;
  document.getElementById('f_id').value = b.ID;
  document.getElementById('f_brand').value = b.Brand;
  document.getElementById('f_model').value = b.Model;
  document.getElementById('f_year').value = b.Year;
  document.getElementById('f_km').value = b.KM;
  document.getElementById('f_price').value = b.Price;
  document.getElementById('f_fuel').value = b.FuelType;
  document.getElementById('f_condition').value = b.Condition;
  document.getElementById('f_owners').value = b.Owners;
  document.getElementById('f_insurance').value = b.Insurance;
  document.getElementById('f_desc').value = b.Description;
  document.getElementById('f_images').value = b.Images;
  document.getElementById('saveBtn').textContent = 'Update Bike';
  document.querySelector('.admin-tab[data-tab="addTab"]').click();
}

async function deleteBikeConfirm(id){
  if(!confirm('Delete this bike permanently?')) return;
  const res = await apiCall({action:'delete', id, pin: sessionPin});
  if(res.success){ toast('Deleted'); await loadBikes(); }
  else toast('Error: ' + res.error);
}
async function toggleBikeStatus(id){
  const res = await apiCall({action:'toggle', id, pin: sessionPin});
  if(res.success){ toast('Status updated'); await loadBikes(); }
  else toast('Error: ' + res.error);
}

function renderAdminList(){
  document.getElementById('bikeCount').textContent = allBikes.length;
  const list = document.getElementById('adminList');
  if(allBikes.length === 0){ list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;font-family:JetBrains Mono, monospace;font-size:12px;">No bikes yet</p>'; return; }
  list.innerHTML = allBikes.map(b=>{
    const img = (b.Images||'').split('\n').filter(Boolean)[0] || PLACEHOLDER_IMG;
    return `
    <div class="admin-list-item">
      <img src="${img}" onerror="this.src='${PLACEHOLDER_IMG}'">
      <div class="admin-list-info">
        <h4>${b.Brand} ${b.Model}</h4>
        <span>${fmtPrice(b.Price)} · ${b.Status}</span>
      </div>
      <div class="admin-list-actions">
        <button onclick="editBike('${b.ID}')">Edit</button>
        <button class="toggle" onclick="toggleBikeStatus('${b.ID}')">${b.Status==='Sold'?'Mark Avail':'Mark Sold'}</button>
        <button class="danger" onclick="deleteBikeConfirm('${b.ID}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

loadBikes();
</script>
</body>
</html>
